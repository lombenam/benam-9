name: Build benam

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          URL=$(echo '${{ github.event.inputs.payload }}' | jq -r '.zipAssetUrl')
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/octet-stream" -o project.zip "$URL"
          mkdir -p project
          unzip -qq project.zip -d project
          GRADLEW=$(find project -maxdepth 8 -iname "gradlew" | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew tidak ditemukan di dalam ZIP"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$GRADLEW")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Clean Stale Build Cache
        run: |
          cd "${{ env.PROJECT_ROOT }}"
          rm -rf build app/build .gradle
          find . -iname "local.properties" -delete

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate App Icons
        run: |
          ICON_SCRIPT="$(dirname "${{ env.PROJECT_ROOT }}")/generate_icons.py"
          if [ -f "$ICON_SCRIPT" ]; then
            pip install Pillow
            cd "$(dirname "$ICON_SCRIPT")"
            python3 generate_icons.py
          fi

      - name: Setup Gradle Wrapper Permission
        run: chmod +x "${{ env.PROJECT_ROOT }}/gradlew"

      - name: Build APK Release
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/*.apk
          retention-days: 7
